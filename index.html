<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gaon Organic</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#fffaf0}header{background:#2e7d32;color:#fff;padding:12px;display:flex;justify-content:space-between} .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px} .card{background:#fff;border-radius:12px;padding:8px;box-shadow:0 2px 5px #0002;text-align:center} .card img{width:100%;height:110px;object-fit:cover;border-radius:8px} .card button{background:#2e7d32;color:#fff;border:none;padding:8px;width:100%;border-radius:8px;margin-top:6px}</style></head><body>
<header><b>🌿 Gaon Organic</b><span>☰</span></header>
<div style="height:160px;background:url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=800') center/cover;display:flex;align-items:end;padding:15px;color:#fff;font-weight:800;text-shadow:0 2px 5px #000">Gaon Ki Shuddh Kheti</div>
<div class="grid" id="grid"></div>
<script>
let products=[
{name:"Desi Ghee 1kg",price:1200,img:"https://images.unsplash.com/photo-1589985270826-4b7bb135bc9d?w=400"},
{name:"Toor Dal 1kg",price:350,img:"https://images.unsplash.com/photo-1586201375761-83865001e31c?w=400"},

{name:"Honey 500g",price:650,img:"https://images.unsplash.com/photo-1587049352846-4a222e784d38?w=400"},

{name:"Rajma 1kg",price:320,img:"https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=400"},
{name:"A2 Ghee 500g",price:950,img:"https://images.unsplash.com/photo-1589985270826-4b7bb135bc9d?w=400"},
{name:"Haldi 500g",price:250,img:"https://images.unsplash.com/photo-1615484477778-ca3b77958998?w=400"},
{name:"Jaggery 1kg",price:280,img:"https://images.unsplash.com/photo-1599490659213-cebb64338dc7?w=400"},
{name:"Masoor Dal 1kg",price:300,img:"https://images.unsplash.com/photo-1586201375761-83865001e31c?w=400"},
{name:"Oil Combo",price:1350,img:"https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?w=400"},

{name:"Ghee 2kg",price:2200,img:"https://images.unsplash.com/photo-1589985270826-4b7bb135bc9d?w=400"},
{name:"Herbal Tea",price:420,img:"https://images.unsplash.com/photo-1564890369478-c89ca6d9cde9?w=400"}
];
document.getElementById('grid').innerHTML=products.map(p=>`<div class="card"><img src="${p.img}"><h4 style="font-size:12px;margin:6px 0">${p.name}</h4><b style="color:green">₹${p.price}</b><button onclick="alert('${p.name} added ✅')">Add to Cart</button></div>`).join('');
</script></body></html>
