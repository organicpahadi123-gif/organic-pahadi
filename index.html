<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gaon Organic</title>
<style>
body{font-family:system-ui;margin:0;background:#f6f7f4;padding-bottom:100px}
header{display:flex;gap:10px;align-items:center;padding:12px 15px;background:#fff;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px #0001}
.search{flex:1;background:#f1f1f1;border:0;padding:10px 14px;border-radius:25px;outline:none}
.dotBtn{font-size:24px;background:none;border:0;cursor:pointer}
#filterMenu{position:absolute;right:15px;top:55px;background:#fff;width:220px;border-radius:12px;box-shadow:0 10px 30px #0002;padding:10px;display:none;z-index:20}
#filterMenu button{width:100%;text-align:left;background:none;border:0;padding:10px;border-radius:8px;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:15px;max-width:900px;margin:auto}
.card{background:#fff;border-radius:14px;padding:10px;position:relative}
.card img{width:100%;height:130px;object-fit:cover;border-radius:10px}
.add{width:100%;background:#000;color:#fff;border:0;padding:9px;border-radius:20px;margin-top:8px;font-weight:bold;cursor:pointer}
.shareBtn{position:absolute;top:15px;right:15px;background:#fff;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px #0003;cursor:pointer;border:0}
#cartSheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -5px 30px #0003;transform:translateY(100%);transition:0.35s;z-index:60;height:92vh;display:flex;flex-direction:column}
#cartSheet.open{transform:translateY(0)}
.cartHead{flex-shrink:0;display:flex;justify-content:space-between;padding:18px;border-bottom:1px solid #eee;font-weight:bold}
.cartBody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:15px}
.checkoutFooter{flex-shrink:0;max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch;border-top:1px solid #eee;padding:15px;background:#fff}
.wa-float{position:fixed;bottom:20px;right:15px;background:#25D366;color:#fff;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;text-decoration:none;z-index:40}
.badge{background:#000;color:#fff;padding:2px 7px;border-radius:10px;font-size:12px;cursor:pointer}
#toast{position:fixed;left:12px;right:12px;bottom:18px;background:#111;color:#fff;padding:12px 14px;border-radius:14px;display:flex;justify-content:space-between;align-items:center;transform:translateY(150px);transition:0.3s;z-index:70;box-shadow:0 8px 20px #0004}
#toast.show{transform:translateY(0)}
#toast button{background:#fff;color:#000;border:0;padding:7px 12px;border-radius:20px;font-weight:bold;cursor:pointer}
.input{width:100%;padding:12px;border:1px solid #ccc;border-radius:10px;box-sizing:border-box;margin-bottom:8px}
.couponBox{display:flex;gap:6px;margin-bottom:10px}
</style>
</head><body>
<header>
  <b id="shopTitle">🌿 Gaon Organic</b>
  <input id="search" class="search" placeholder="Search..." oninput="renderShop()">
  <span id="cartCount" class="badge" onclick="openCart()">0</span>
  <button class="dotBtn" onclick="toggleFilter()">⋮</button>
  <div id="filterMenu">
    <button onclick="setSort('low')">Price: Low to High</button>
    <button onclick="setSort('high')">Price: High to Low</button>
    <button onclick="setPriceRange(0,1000)">₹0 - ₹1000</button>
    <button onclick="setPriceRange(1000,2000)">₹1000 - ₹2000</button>
    <button onclick="setPriceRange(2000,999999)">₹2000+</button>
    <button onclick="setPriceRange(0,999999)">Sab Dikhao</button>
  </div>
</header>

<div class="grid" id="grid"></div>
<div id="toast"><span id="toastText">Added to cart</span><button onclick="openCart(true)">View Cart</button></div>

<div id="cartSheet">
  <div class="cartHead"><span>🛒 Cart (<span id="cCount2">0</span>)</span><span onclick="openCart()" style="cursor:pointer">✕</span></div>
  <div class="cartBody" id="cartItems"></div>
  <div class="checkoutFooter">
    <div style="display:flex;justify-content:space-between;margin-bottom:5px"><span>Subtotal</span><span>₹<span id="subtotal">0</span></span></div>
    <div id="couponRow" style="display:flex;justify-content:space-between;margin-bottom:5px;color:#2e7d32;display:none"><span>Coupon (<span id="couponCodeShow"></span>)</span><span>-₹<span id="couponAmt">0</span></span></div>
    <div style="display:flex;justify-content:space-between;margin-bottom:5px"><span>Delivery</span><span id="deliveryText">₹50</span></div>
    <div style="display:flex;justify-content:space-between;font-weight:bold;font-size:18px;margin-bottom:12px"><span>Total</span><span>₹<span id="total">0</span></span></div>

    <div id="step1">
      <div class="couponBox">
        <input id="couponInput" class="input" style="margin:0" placeholder="Coupon code?">
        <button onclick="applyCoupon()" style="padding:12px 16px;border-radius:10px;border:0;background:#000;color:#fff;font-weight:bold">Apply</button>
      </div>
      <button onclick="goCheckout()" style="width:100%;background:#000;color:#fff;padding:14px;border:0;border-radius:12px;font-weight:bold;font-size:16px">Proceed to Checkout →</button>
      <small style="display:block;text-align:center;margin-top:6px;color:#666">Cart check karo phir proceed karo</small>
    </div>

    <div id="step2" style="display:none">
      <div id="qrBox" style="display:none;text-align:center;background:#f0fdf4;padding:12px;border-radius:12px;margin-bottom:10px;border:1px dashed #25D366">
        <p style="margin:0 0 8px 0;font-weight:bold">📱 UPI QR se Pay Karo</p>
        <img id="showQR" style="width:180px;border-radius:12px;background:#fff;padding:5px">
        <p style="font-size:12px;color:#444;margin:6px 0 0 0">Total ₹<span id="qrAmt">0</span> pay karke screenshot bhej do</p>
      </div>
      <input id="custName" class="input" placeholder="1. Full Name *">
      <input id="custPO" class="input" placeholder="2. P.O. (Post Office) *">
      <input id="custVill" class="input" placeholder="3. Vill / City *">
      <input id="custDist" class="input" placeholder="4. District *">
      <input id="custState" class="input" placeholder="5. State *">
      <input id="custPin" class="input" placeholder="6. Pincode *">
      <small id="pinErr" style="color:#ff4444;display:none;margin:-4px 0 8px 0;display:none">⚠️ Is pincode pe delivery nahi hai</small>
      <input id="custMobile" class="input" placeholder="Mobile Number *">
      <button onclick="placeOrder()" style="width:100%;background:#25D366;color:#fff;padding:14px;border:0;border-radius:12px;font-weight:bold;font-size:16px">✅ WhatsApp pe Order Bhejo</button>
      <button onclick="backToCart()" style="width:100%;background:#eee;padding:10px;border:0;border-radius:10px;margin-top:8px;margin-bottom:40px">← Back to Cart</button>
    </div>
  </div>
</div>

<a class="wa-float" id="waSupport" href="#" target="_blank">💬</a>

<script>
let products=JSON.parse(localStorage.getItem('gaon_products')||'[]');
let settings=JSON.parse(localStorage.getItem('gaon_settings')||'{"orderNo":"916395856099","supportNo":"916395856099","shopName":"Gaon Organic","pincodes":"","couponCode":"GAON20","couponDiscount":"20"}');
let cart=JSON.parse(localStorage.getItem('gaon_cart')||'[]');
let sortType='', minPrice=0, maxPrice=999999;
let discount=0, appliedCoupon='';
document.getElementById('shopTitle').innerText='🌿 '+(settings.shopName||'Gaon Organic');
function toggleFilter(){let m=document.getElementById('filterMenu'); m.style.display=m.style.display=='block'?'none':'block';}
function setSort(t){sortType=t; toggleFilter(); renderShop();}
function setPriceRange(a,b){minPrice=a; maxPrice=b; toggleFilter(); renderShop();}
function renderShop(){
  let q=document.getElementById('search').value.toLowerCase();
  let f=products.filter(p=>p.name.toLowerCase().includes(q) && p.price>=minPrice && p.price<=maxPrice);
  if(sortType=='low') f.sort((a,b)=>a.price-b.price);
  if(sortType=='high') f.sort((a,b)=>b.price-a.price);
  let g=document.getElementById('grid');
  if(f.length==0){g.innerHTML=`<p style="grid-column:1/-1;text-align:center;padding:30px">Koi product nahi<br><a href="admin.html">Admin me add karo</a></p>`; return;}
  g.innerHTML=''; f.forEach(p=>{
    let st=p.stock==0?'Out of Stock':p.stock<=3?`Only ${p.stock} left`:'In Stock';
    let cl=p.stock==0?'#ff4444':p.stock<=3?'#ff9800':'#2e7d32';
    let cat = p.cat||''; let unit = p.unit||'';
    g.innerHTML+=`<div class="card"><button class="shareBtn" onclick="shareProd(${p.id})">↗️</button><img src="${p.img}"><div style="font-weight:bold;margin-top:6px">${p.name}</div><small>${cat} ${unit? '• '+unit:''}</small><div style="display:flex;justify-content:space-between;margin-top:4px"><b>₹${p.price}</b><small style="color:${cl};font-weight:bold">${st}</small></div><button class="add" ${p.stock==0?'disabled style="background:#ccc"':''} onclick="addToCart(${p.id})">${p.stock==0?'Out of Stock':'Add to Cart'}</button></div>`;
  });
}
function shareProd(id){
  let p=products.find(x=>x.id==id); if(!p) return;
  let txt=`${p.name} - ₹${p.price} 🌿 ${location.href}`;
  if(navigator.share){navigator.share({title:p.name,text:txt,url:location.href})}else{window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`,'_blank')}
}
function addToCart(id){
  let prod=products.find(x=>x.id==id); if(!prod||prod.stock==0) return;
  let it=cart.find(x=>x.id==id); if(it){ if(it.qty>=prod.stock) return alert('Itna hi stock hai'); it.qty++; } else cart.push({...prod,qty:1});
  saveCart(); showToast(prod.name);
}
let toastTimer;
function showToast(name){
  document.getElementById('toastText').innerText=name+' added ✓';
  let t=document.getElementById('toast'); t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),3000);
}
function saveCart(){localStorage.setItem('gaon_cart',JSON.stringify(cart)); updateCart();}
function updateCart(){
  settings=JSON.parse(localStorage.getItem('gaon_settings')||'{"orderNo":"916395856099","supportNo":"916395856099","shopName":"Gaon Organic","pincodes":"","couponCode":"GAON20","couponDiscount":"20"}');
  let subtotal=0,count=0; let div=document.getElementById('cartItems'); div.innerHTML='';
  cart.forEach((it,idx)=>{subtotal+=it.price*it.qty; count+=it.qty;
    let unit = it.unit||'';
    div.innerHTML+=`<div style="display:flex;gap:10px;margin-bottom:12px;align-items:center"><img src="${it.img}" style="width:55px;height:55px;border-radius:8px;object-fit:cover"><div style="flex:1"><b>${it.name}</b><br><small>₹${it.price} ${unit} x ${it.qty} = ₹${it.price*it.qty}</small></div><button onclick="chg(${idx},1)" style="padding:6px 10px;border-radius:50%;border:1px solid #ccc">+</button><button onclick="chg(${idx},-1)" style="padding:6px 10px;border-radius:50%;border:1px solid #ccc">-</button></div>`;
  });
  let delivery = subtotal >= 1000 || subtotal==0? 0 : 50;
  let grandTotal = subtotal - discount + delivery;
  if(grandTotal<0) grandTotal=0;
  document.getElementById('subtotal').innerText=subtotal;
  document.getElementById('total').innerText=grandTotal;
  document.getElementById('deliveryText').innerText= delivery==0? (subtotal==0? '₹0' : 'FREE') : `₹${delivery}`;
  document.getElementById('cartCount').innerText=count;
  document.getElementById('cCount2').innerText=count;
  document.getElementById('qrAmt').innerText=grandTotal;
  if(settings.qrImage) document.getElementById('showQR').src=settings.qrImage;
  if(discount>0){
    document.getElementById('couponRow').style.display='flex';
    document.getElementById('couponCodeShow').innerText=appliedCoupon;
    document.getElementById('couponAmt').innerText=discount;
  } else {
    document.getElementById('couponRow').style.display='none';
  }
}
function applyCoupon(){
  let code=document.getElementById('couponInput').value.trim().toUpperCase();
  if(!code) return;
  settings=JSON.parse(localStorage.getItem('gaon_settings')||'{}');
  if(settings.couponCode && code===settings.couponCode.toUpperCase()){
    let subtotal=0; cart.forEach(it=>subtotal+=it.price*it.qty);
    discount = Math.round(subtotal * (parseInt(settings.couponDiscount||20)/100));
    appliedCoupon=code;
    alert('Coupon lag gaya! ₹'+discount+' off');
  } else {
    discount=0; appliedCoupon=''; alert('Galat coupon');
  }
  saveCart();
}
function chg(i,d){
  let prod=products.find(x=>x.id==cart[i].id);
  if(d>0 && prod && cart[i].qty>=prod.stock) return alert('Stock khatam');
  cart[i].qty+=d; if(cart[i].qty<=0) cart.splice(i,1); saveCart();
}
function openCart(forceOpen){
  let s=document.getElementById('cartSheet');
  if(forceOpen===true) s.classList.add('open'); else s.classList.toggle('open');
  document.getElementById('toast').classList.remove('show');
  if(!s.classList.contains('open')){ document.getElementById('step1').style.display='block'; document.getElementById('step2').style.display='none'; }
}
function goCheckout(){
  if(cart.length==0) return alert('Cart khali hai');
  document.getElementById('step1').style.display='none';
  document.getElementById('step2').style.display='block';
  document.getElementById('qrBox').style.display = (settings.qrImage && document.getElementById('total').innerText>0)? 'block' : 'none';
  document.querySelector('.checkoutFooter').scrollTop = 0;
}
function backToCart(){ document.getElementById('step1').style.display='block'; document.getElementById('step2').style.display='none'; }
function placeOrder(){
  settings=JSON.parse(localStorage.getItem('gaon_settings')||'{"orderNo":"916395856099","supportNo":"916395856099","shopName":"Gaon Organic","pincodes":""}');
  if(cart.length==0) return alert('Cart khali hai');
  let name=document.getElementById('custName').value.trim();
  let po=document.getElementById('custPO').value.trim();
  let vill=document.getElementById('custVill').value.trim();
  let dist=document.getElementById('custDist').value.trim();
  let state=document.getElementById('custState').value.trim();
  let pin=document.getElementById('custPin').value.trim();
  let mobile=document.getElementById('custMobile').value.trim();
  if(!name||!po||!vill||!dist||!state||!pin||!mobile) return alert('Saare field bharo *');
  
  if(settings.pincodes && settings.pincodes.trim()!=""){
    let allowed = settings.pincodes.split(',').map(s=>s.trim());
    if(!allowed.includes(pin)){
      document.getElementById('pinErr').style.display='block';
      return alert('Is pincode ('+pin+') pe delivery nahi hai. Allowed: '+settings.pincodes);
    }
  }
  document.getElementById('pinErr').style.display='none';

  let subtotal=0; cart.forEach(it=>subtotal+=it.price*it.qty);
  let delivery = subtotal >= 1000? 0 : 50;
  let grandTotal = subtotal - discount + delivery;

  // STOCK CUT
  let allProducts = JSON.parse(localStorage.getItem('gaon_products')||'[]');
  cart.forEach(c=>{
    let idx=allProducts.findIndex(p=>p.id==c.id);
    if(idx>=0){ allProducts[idx].stock = Math.max(0, (allProducts[idx].stock||0) - c.qty); }
  });
  localStorage.setItem('gaon_products', JSON.stringify(allProducts));
  products = allProducts;

  let bill=cart.map(i=>{let u=i.unit?`(${i.unit})`:''; return `${i.name} ${u} x ${i.qty} = ₹${i.price*i.qty}`;}).join('%0A');
  let couponText = discount>0 ? `%0ACoupon ${appliedCoupon}: -₹${discount}` : '';
  let msg=`🌿 ${settings.shopName} - New Order%0A%0AName: ${name}%0AMobile: ${mobile}%0AP.O.: ${po}%0AVill/City: ${vill}%0ADist: ${dist}%0AState: ${state}%0APin: ${pin}%0A%0ABILL:%0A${bill}${couponText}%0ATotal: ₹${grandTotal}%0APayment: UPI QR Done`;
  window.open(`https://wa.me/${settings.orderNo}?text=${msg}`,'_blank');
  
  cart=[]; discount=0; appliedCoupon=''; saveCart(); renderShop();
}
document.getElementById('waSupport').href=`https://wa.me/${settings.supportNo}?text=Hi Support`;
renderShop(); updateCart();
document.addEventListener('click',e=>{if(!e.target.closest('header')) document.getElementById('filterMenu').style.display='none';});
</script></body></html>
