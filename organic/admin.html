<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gaon Organic Admin</title>

<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#f1f8e9;padding:10px}
header{background:#2e7d32;color:white;padding:13px;border-radius:10px;display:flex;justify-content:space-between}
.box{background:white;padding:15px;border-radius:10px;margin:10px 0}
input{width:100%;padding:11px;margin:5px 0;border:1px solid #ccc;border-radius:8px}
.btn{width:100%;padding:11px;margin-top:7px;background:#2e7d32;color:white;border:0;border-radius:8px;font-weight:bold}
.tabs{display:flex;gap:5px;overflow:auto}
.tabs button{padding:9px 13px;white-space:nowrap;border:1px solid #2e7d32;border-radius:20px;background:white}
.sec{display:none}
.item{border:1px solid #ddd;padding:10px;margin:7px 0;border-radius:8px}
</style>
</head>

<body>

<header>
<b>👑 Admin Panel</b>
<div>
<a href="index.html" style="color:white">Dukaan</a>
<button onclick="logout()" style="background:red;color:white;border:0;padding:6px;border-radius:5px">
Logout
</button>
</div>
</header>

<!-- LOGIN -->

<div id="login" class="box" style="max-width:380px;margin:60px auto;text-align:center">

<h3>🔐 Admin Login</h3>

<input id="email"
type="email"
value="organicpahadi123@gmail.com"
placeholder="Email">

<input id="password"
type="password"
placeholder="Password">

<button class="btn" onclick="login()">
Login
</button>

<button class="btn"
style="background:#1565c0"
onclick="forgot()">
Forgot Password
</button>

<p id="msg"></p>

</div>

<!-- ADMIN -->

<main id="main" style="display:none">

<div class="tabs">

<button onclick="tab('orders')">
📦 Orders
</button>

<button onclick="tab('products')">
📋 Products
</button>

<button onclick="tab('add')">
➕ Add
</button>

<button onclick="tab('settings')">
⚙️ Settings
</button>

</div>

<div id="orders" class="sec box">
<h3>📦 Orders</h3>
<div id="orderList">Loading...</div>
</div>

<div id="products" class="sec box">
<h3>📋 Products</h3>
<div id="productList">Loading...</div>
</div>

<div id="add" class="sec box">

<h3>➕ New Product</h3>

<input id="name" placeholder="Product Name">
<input id="price" type="number" placeholder="Price">
<input id="stock" type="number" placeholder="Stock">
<input id="image" placeholder="Image URL">

<button class="btn" onclick="addProduct()">
Add Product
</button>

</div>

<div id="settings" class="sec box">

<h3>⚙️ Settings</h3>

<input id="banner"
placeholder="Banner Image URL">

<button class="btn" onclick="saveBanner()">
Save Banner
</button>

</div>

</main>

<script type="module">

import{
initializeApp
}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import{
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut,
sendPasswordResetEmail
}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import{
getDatabase,
ref,
onValue,
push,
update,
remove,
set
}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app=initializeApp({

apiKey:"AIzaSyB80IKiUQA_t2IhXBgZjPI2kPQKqc1xSF8",
authDomain:"gaon-organic.firebaseapp.com",
databaseURL:"https://gaon-organic-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"gaon-organic",
storageBucket:"gaon-organic.firebasestorage.app",
messagingSenderId:"29340220943",
appId:"1:29340220943:web:7cc9a5a9b8329bcef9ad7a"

});

const auth=getAuth(app);
const db=getDatabase(app);

const $=id=>document.getElementById(id);

/* LOGIN */

window.login=async()=>{

try{

await signInWithEmailAndPassword(
auth,
$("email").value.trim(),
$("password").value
);

$("msg").innerText="Login successful ✅";

}catch(e){

$("msg").innerText="Email ya Password galat hai ❌";

}

};

/* FORGOT PASSWORD */

window.forgot=async()=>{

try{

await sendPasswordResetEmail(
auth,
$("email").value.trim()
);

$("msg").innerText=
"Password reset email bhej diya ✅";

}catch(e){

$("msg").innerText=
"Reset email nahi bhej paya ❌";

}

};

/* LOGOUT */

window.logout=()=>{
signOut(auth);
};

/* AUTH CHECK */

onAuthStateChanged(auth,user=>{

if(user){

$("login").style.display="none";
$("main").style.display="block";

tab("orders");
loadData();

}else{

$("login").style.display="block";
$("main").style.display="none";

}

});

/* TABS */

window.tab=id=>{

document.querySelectorAll(".sec")
.forEach(x=>x.style.display="none");

$(id).style.display="block";

};

/* DATA */

function loadData(){

/* ORDERS */

onValue(ref(db,"orders"),s=>{

let data=s.val()||{};

$("orderList").innerHTML=
Object.entries(data)
.reverse()
.map(([key,o])=>`

<div class="item">

<b>${o.id}</b><br>

📱 ${o.mobile}<br>

💰 ₹${o.total}<br>

${(o.items||[])
.map(i=>i.name+" × "+i.qty)
.join(", ")}

<br><br>

<select
onchange="changeStatus('${key}',this.value)">

<option>${o.status}</option>
<option>Confirmed</option>
<option>Out for Delivery</option>
<option>Delivered</option>
<option>Cancelled</option>

</select>

</div>

`).join("")||"No Orders";

});

/* PRODUCTS */

onValue(ref(db,"products"),s=>{

let data=s.val()||{};

$("productList").innerHTML=
Object.entries(data)
.map(([key,p])=>`

<div class="item">

<b>${p.name}</b>

<input
id="price_${key}"
type="number"
value="${p.price}">

<input
id="stock_${key}"
type="number"
value="${p.stock}">

<button class="btn"
onclick="saveProduct('${key}')">
Save
</button>

<button class="btn"
style="background:red"
onclick="deleteProduct('${key}')">
Delete
</button>

</div>

`).join("")||"No Products";

});

/* BANNER */

onValue(ref(db,"settings/banner"),s=>{

if(s.val())
$("banner").value=s.val();

});

}

/* ORDER STATUS */

window.changeStatus=(key,status)=>{

update(
ref(db,"orders/"+key),
{status}
);

};

/* PRODUCT SAVE */

window.saveProduct=key=>{

update(
ref(db,"products/"+key),
{
price:+$("price_"+key).value,
stock:+$("stock_"+key).value
}
);

alert("Saved ✅");

};

/* PRODUCT DELETE */

window.deleteProduct=key=>{

if(confirm("Product delete kare?"))
remove(ref(db,"products/"+key));

};

/* ADD PRODUCT */

window.addProduct=()=>{

let name=$("name").value;
let price=+$("price").value;
let stock=+$("stock").value;
let image=$("image").value;

if(!name||!price)
return alert("Name aur Price dalo");

push(ref(db,"products"),{
name,
price,
stock:stock||10,
img:image||""
});

$("name").value="";
$("price").value="";
$("stock").value="";
$("image").value="";

alert("Product Added ✅");

};

/* BANNER */

window.saveBanner=()=>{

set(
ref(db,"settings/banner"),
$("banner").value
);

alert("Banner Saved ✅");

};

</script>

</body>
</html>
