<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gaon Organic - Admin</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f4f6f5;color:#222}
header{background:#166534;color:white;padding:15px;text-align:center}
nav{display:flex;gap:6px;padding:10px;background:white;overflow:auto}
nav button{border:0;padding:10px 14px;border-radius:7px;background:#e5e7eb}
nav button.active{background:#166534;color:white}
main{max-width:900px;margin:auto;padding:15px}
.card{background:white;padding:15px;margin-bottom:15px;border-radius:10px;box-shadow:0 2px 8px #0001}
input,select{width:100%;padding:11px;margin:6px 0 10px;border:1px solid #ccc;border-radius:6px}
button{cursor:pointer}
.save{background:#166534;color:white;border:0;padding:10px 15px;border-radius:6px}
.del{background:#dc2626;color:white;border:0;padding:8px 12px;border-radius:6px}
.item{border:1px solid #ddd;padding:12px;margin:10px 0;border-radius:8px}
img{max-width:100%;border-radius:7px}
.sec{display:none}
.sec.active{display:block}
.small{color:#666;font-size:13px}
</style>
</head>

<body>

<header>
<h2>🌿 Gaon Organic Admin</h2>
<p>Testing Mode</p>
</header>

<nav>
<button class="active" onclick="show('orders',this)">Orders</button>
<button onclick="show('products',this)">Products</button>
<button onclick="show('add',this)">Add Product</button>
<button onclick="show('settings',this)">Settings</button>
</nav>

<main>

<!-- ORDERS -->
<section id="orders" class="sec active">
<div class="card">
<h3>📦 Orders</h3>
<div id="ordersList">Loading...</div>
</div>
</section>

<!-- PRODUCTS -->
<section id="products" class="sec">
<div class="card">
<h3>🛒 Products</h3>
<div id="productsList">Loading...</div>
</div>
</section>

<!-- ADD PRODUCT -->
<section id="add" class="sec">
<div class="card">
<h3>➕ Add Product</h3>

<input id="pName" placeholder="Product Name">
<input id="pPrice" type="number" placeholder="Price">
<input id="pStock" type="number" placeholder="Stock">
<input id="pImage" placeholder="Image URL">

<button class="save" onclick="addProduct()">Add Product</button>

<p id="addMsg"></p>
</div>
</section>

<!-- SETTINGS -->
<section id="settings" class="sec">
<div class="card">
<h3>⚙️ Settings</h3>

<label>Banner Image URL</label>
<input id="bannerUrl" placeholder="Banner image URL">

<button class="save" onclick="saveBanner()">Save Banner</button>

<p id="settingMsg"></p>
</div>
</section>

</main>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
getDatabase,
ref,
set,
push,
onValue,
update,
remove
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig={
apiKey:"AIzaSyB80IKiUQA_t2IhXBgPI2kPQKqc1xSF8",
authDomain:"gaon-organic.firebaseapp.com",
databaseURL:"https://gaon-organic-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"gaon-organic",
storageBucket:"gaon-organic.firebasestorage.app",
messagingSenderId:"29340220943",
appId:"1:29340220943:web:7cc9a5a9b8329bcef9ad7a"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

window.show=function(id,btn){

document.querySelectorAll(".sec")
.forEach(x=>x.classList.remove("active"));

document.getElementById(id)
.classList.add("active");

document.querySelectorAll("nav button")
.forEach(x=>x.classList.remove("active"));

btn.classList.add("active");

};

/* PRODUCTS */

function loadProducts(){

onValue(ref(db,"products"),snap=>{

const data=snap.val()||{};
let html="";

Object.entries(data).forEach(([key,p])=>{

html+=`
<div class="item">

<strong>${p.name||"Unnamed Product"}</strong>

<p>Price: ₹${p.price||0}</p>
<p>Stock: ${p.stock||0}</p>

${p.image?`<img src="${p.image}">`:""}

<br><br>

<input id="price_${key}" type="number"
value="${p.price||0}" placeholder="Price">

<input id="stock_${key}" type="number"
value="${p.stock||0}" placeholder="Stock">

<button class="save"
onclick="updateProduct('${key}')">
Save
</button>

<button class="del"
onclick="deleteProduct('${key}')">
Delete
</button>

</div>
`;

});

document.getElementById("productsList").innerHTML=
html||"<p>No products found.</p>";

});

}

window.updateProduct=async function(key){

const price=document.getElementById("price_"+key).value;
const stock=document.getElementById("stock_"+key).value;

await update(ref(db,"products/"+key),{
price:Number(price),
stock:Number(stock)
});

alert("Product updated");

};

window.deleteProduct=async function(key){

if(!confirm("Delete this product?"))return;

await remove(ref(db,"products/"+key));

alert("Product deleted");

};

/* ADD PRODUCT */

window.addProduct=async function(){

const name=document.getElementById("pName").value.trim();
const price=document.getElementById("pPrice").value;
const stock=document.getElementById("pStock").value;
const image=document.getElementById("pImage").value.trim();

if(!name||!price){

document.getElementById("addMsg").textContent=
"Product name and price required";

return;

}

const newRef=push(ref(db,"products"));

await set(newRef,{
name:name,
price:Number(price),
stock:Number(stock||0),
image:image
});

document.getElementById("pName").value="";
document.getElementById("pPrice").value="";
document.getElementById("pStock").value="";
document.getElementById("pImage").value="";

document.getElementById("addMsg").textContent=
"✅ Product added successfully";

};

/* ORDERS */

function loadOrders(){

onValue(ref(db,"orders"),snap=>{

const data=snap.val()||{};
let html="";

Object.entries(data).reverse().forEach(([key,o])=>{

html+=`
<div class="item">

<strong>Order ID: ${key}</strong>

<p>Name: ${o.name||"-"}</p>
<p>Phone: ${o.phone||"-"}</p>
<p>Address: ${o.address||"-"}</p>
<p>Total: ₹${o.total||0}</p>

<label>Status</label>

<select id="status_${key}">
<option ${o.status=="Pending"?"selected":""}>Pending</option>
<option ${o.status=="Confirmed"?"selected":""}>Confirmed</option>
<option ${o.status=="Packed"?"selected":""}>Packed</option>
<option ${o.status=="Shipped"?"selected":""}>Shipped</option>
<option ${o.status=="Delivered"?"selected":""}>Delivered</option>
<option ${o.status=="Cancelled"?"selected":""}>Cancelled</option>
</select>

<button class="save"
onclick="updateOrder('${key}')">
Update Status
</button>

</div>
`;

});

document.getElementById("ordersList").innerHTML=
html||"<p>No orders found.</p>";

});

}

window.updateOrder=async function(key){

const status=
document.getElementById("status_"+key).value;

await update(ref(db,"orders/"+key),{
status:status
});

alert("Order status updated");

};

/* BANNER */

function loadBanner(){

onValue(ref(db,"settings/banner"),snap=>{

document.getElementById("bannerUrl").value=
snap.val()||"";

});

}

window.saveBanner=async function(){

const url=document.getElementById("bannerUrl").value.trim();

await set(ref(db,"settings/banner"),url);

document.getElementById("settingMsg").textContent=
"✅ Banner saved";

};

/* START */

loadProducts();
loadOrders();
loadBanner();

</script>

</body>
</html>
