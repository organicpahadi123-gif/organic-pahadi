<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaon Organic - Admin Panel</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f6f8;
  color:#222;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

header{
  background:#176b35;
  color:white;
  padding:15px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  position:sticky;
  top:0;
  z-index:20;
}

header h1{
  font-size:21px;
}

.header-right{
  display:flex;
  align-items:center;
  gap:8px;
}

.container{
  max-width:1250px;
  margin:auto;
  padding:20px;
}

/* LOGIN */

.login-box{
  max-width:420px;
  margin:80px auto;
  background:white;
  padding:30px;
  border-radius:16px;
  box-shadow:0 5px 25px rgba(0,0,0,.1);
}

.login-box h2{
  text-align:center;
  margin-bottom:8px;
  color:#176b35;
}

.login-box p{
  text-align:center;
  color:#666;
  margin-bottom:22px;
}

input,textarea,select{
  width:100%;
  padding:11px 12px;
  border:1px solid #ccc;
  border-radius:8px;
  outline:none;
  background:white;
}

input:focus,textarea:focus,select:focus{
  border-color:#176b35;
}

textarea{
  min-height:90px;
  resize:vertical;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
}

.form-group{
  margin-bottom:14px;
}

.btn{
  border:0;
  padding:10px 15px;
  border-radius:8px;
  font-weight:bold;
}

.btn-primary{
  background:#176b35;
  color:white;
}

.btn-primary:hover{
  background:#0f572a;
}

.btn-danger{
  background:#d93636;
  color:white;
}

.btn-warning{
  background:#e09b16;
  color:white;
}

.btn-secondary{
  background:#666;
  color:white;
}

.btn-success{
  background:#218838;
  color:white;
}

.btn-small{
  padding:7px 10px;
  font-size:13px;
}

.message{
  margin-top:12px;
  padding:10px;
  border-radius:8px;
  display:none;
}

.message.success{
  display:block;
  background:#dff5e5;
  color:#176b35;
}

.message.error{
  display:block;
  background:#ffe1e1;
  color:#b00000;
}

/* DASHBOARD */

.dashboard-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.stat{
  background:white;
  border-radius:12px;
  padding:20px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.stat h3{
  color:#777;
  font-size:14px;
  margin-bottom:8px;
}

.stat strong{
  font-size:25px;
  color:#176b35;
}

.tabs{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.tab-btn{
  background:white;
  border:1px solid #ddd;
  padding:10px 15px;
  border-radius:8px;
  font-weight:bold;
}

.tab-btn.active{
  background:#176b35;
  color:white;
  border-color:#176b35;
}

.panel{
  background:white;
  border-radius:12px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.panel h2{
  margin-bottom:16px;
  color:#176b35;
  font-size:20px;
}

/* PRODUCTS */

.product-form{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.full{
  grid-column:1/-1;
}

.preview-img{
  width:100px;
  height:100px;
  object-fit:cover;
  border-radius:8px;
  border:1px solid #ddd;
  margin-top:8px;
}

.products-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-top:20px;
}

.product-card{
  border:1px solid #ddd;
  border-radius:10px;
  overflow:hidden;
  background:white;
}

.product-card img{
  width:100%;
  height:160px;
  object-fit:cover;
  background:#eee;
}

.product-info{
  padding:12px;
}

.product-info h3{
  font-size:16px;
  margin-bottom:6px;
}

.product-info p{
  font-size:14px;
  color:#666;
  margin:4px 0;
}

.product-actions{
  display:flex;
  gap:7px;
  margin-top:10px;
}

/* ORDERS */

.order-card{
  border:1px solid #ddd;
  border-radius:12px;
  margin-bottom:15px;
  overflow:hidden;
}

.order-head{
  background:#f7f7f7;
  padding:13px;
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}

.order-body{
  padding:15px;
}

.order-meta{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-bottom:15px;
}

.order-table{
  width:100%;
  border-collapse:collapse;
  margin-bottom:15px;
}

.order-table th,
.order-table td{
  border:1px solid #ddd;
  padding:8px;
  text-align:left;
  font-size:13px;
}

.order-table th{
  background:#f5f5f5;
}

.order-total{
  text-align:right;
  font-size:18px;
  font-weight:bold;
}

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  background:#eee;
}

.status.pending{
  background:#fff0c2;
  color:#856404;
}

.status.verified{
  background:#d9f5df;
  color:#176b35;
}

.status.rejected{
  background:#ffdede;
  color:#a00000;
}

.slip{
  max-width:260px;
  max-height:350px;
  object-fit:contain;
  border:1px solid #ddd;
  border-radius:8px;
  margin-top:8px;
}

/* SETTINGS */

.settings-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.setting-image-preview{
  max-width:250px;
  max-height:180px;
  object-fit:contain;
  border:1px solid #ddd;
  border-radius:8px;
  margin-top:8px;
}

/* INVOICE */

.invoice{
  background:white;
  padding:25px;
  max-width:850px;
  margin:auto;
  border:1px solid #ddd;
}

.invoice-title{
  text-align:center;
  margin-bottom:20px;
}

.invoice-shop{
  font-size:24px;
  color:#176b35;
  font-weight:bold;
}

.invoice table{
  width:100%;
  border-collapse:collapse;
  margin:15px 0;
}

.invoice th,
.invoice td{
  border:1px solid #ddd;
  padding:8px;
}

.invoice-total{
  text-align:right;
  font-size:18px;
  font-weight:bold;
}

/* RESPONSIVE */

@media(max-width:900px){
  .dashboard-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .products-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:650px){
  header{
    padding:12px;
  }

  header h1{
    font-size:17px;
  }

  .container{
    padding:12px;
  }

  .dashboard-grid,
  .products-grid,
  .product-form,
  .settings-grid,
  .order-meta{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .order-table{
    font-size:11px;
  }

  .order-table th,
  .order-table td{
    padding:5px;
  }
}

@media print{
  body{
    background:white;
  }

  header,
  .tabs,
  .no-print{
    display:none!important;
  }

  .container{
    padding:0;
  }

  .invoice{
    border:0;
    max-width:none;
  }
}
</style>
</head>

<script type="module">

/* =========================================
   FIREBASE
========================================= */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  set,
  push,
  update,
  remove,
  onValue,
  get
}
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";


const firebaseConfig = {
  apiKey: "AIzaSyB80IKiUQA_t2IhXBgZjPI2kPQKqc1xSF8",
  authDomain: "gaon-organic.firebaseapp.com",
  databaseURL: "https://gaon-organic-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "gaon-organic",
  storageBucket: "gaon-organic.firebasestorage.app",
  messagingSenderId: "29340220943",
  appId: "1:29340220943:web:7cc9a5a9b8329bcef9ad7a"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);


/* =========================================
   ADMIN EMAIL
========================================= */

const ADMIN_EMAIL = "organicpahadi123@gmail.com";


/* =========================================
   ELEMENTS
========================================= */

const loginPage = document.getElementById("loginPage");
const adminPage = document.getElementById("adminPage");

const loginForm = document.getElementById("loginForm");
const loginMessage = document.getElementById("loginMessage");

const logoutBtn = document.getElementById("logoutBtn");
const adminEmail = document.getElementById("adminEmail");

const ordersList = document.getElementById("ordersList");
const productsList = document.getElementById("productsList");

let allOrders = {};
let allProducts = {};

let currentSettings = {};


/* =========================================
   MESSAGE
========================================= */

function showMessage(element, text, type="success"){
  element.textContent = text;
  element.className = "message " + type;

  setTimeout(()=>{
    element.className = "message";
  },4000);
}


/* =========================================
   AUTH STATE
========================================= */

onAuthStateChanged(auth, async (user)=>{

  if(user){

    /*
      Extra client-side check.
      Real protection will also be done
      by Firebase Database Rules.
    */

    if(
      !user.email ||
      user.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()
    ){

      await signOut(auth);

      loginPage.classList.remove("hidden");
      adminPage.classList.add("hidden");

      showMessage(
        loginMessage,
        "This account is not authorized as admin.",
        "error"
      );

      return;
    }


    loginPage.classList.add("hidden");
    adminPage.classList.remove("hidden");

    adminEmail.textContent = user.email;

    loadProducts();
    loadOrders();
    loadSettings();

  }else{

    loginPage.classList.remove("hidden");
    adminPage.classList.add("hidden");

  }

});


/* =========================================
   LOGIN
========================================= */

loginForm.addEventListener("submit", async (e)=>{

  e.preventDefault();

  const email =
    document.getElementById("loginEmail").value.trim();

  const password =
    document.getElementById("loginPassword").value;


  if(email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()){

    showMessage(
      loginMessage,
      "Only authorized admin email can login.",
      "error"
    );

    return;
  }


  try{

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

    loginForm.reset();

  }catch(error){

    console.error(error);

    let msg = "Login failed.";

    if(error.code === "auth/invalid-credential"){
      msg = "Email or password is incorrect.";
    }

    if(error.code === "auth/user-not-found"){
      msg = "Admin account does not exist yet.";
    }

    if(error.code === "auth/too-many-requests"){
      msg = "Too many attempts. Try again later.";
    }

    showMessage(loginMessage,msg,"error");

  }

});


/* =========================================
   LOGOUT
========================================= */

logoutBtn.addEventListener("click", async ()=>{

  await signOut(auth);

});


/* =========================================
   TABS
========================================= */

document.querySelectorAll(".tab-btn").forEach(btn=>{

  btn.addEventListener("click",()=>{

    document.querySelectorAll(".tab-btn")
      .forEach(x=>x.classList.remove("active"));

    document.querySelectorAll(".tab-content")
      .forEach(x=>x.classList.add("hidden"));

    btn.classList.add("active");

    document
      .getElementById(btn.dataset.tab)
      .classList.remove("hidden");

  });

});


/* =========================================
   IMAGE COMPRESSION
========================================= */

function compressImage(file, maxWidth=1000, quality=.72){

  return new Promise((resolve,reject)=>{

    const reader = new FileReader();

    reader.onload = ()=>{

      const img = new Image();

      img.onload = ()=>{

        let width = img.width;
        let height = img.height;

        if(width > maxWidth){

          height =
            Math.round(height * maxWidth / width);

          width = maxWidth;

        }

        const canvas =
          document.createElement("canvas");

        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d");

        ctx.drawImage(
          img,
          0,
          0,
          width,
          height
        );

        resolve(
          canvas.toDataURL(
            "image/jpeg",
            quality
          )
        );

      };

      img.onerror = reject;

      img.src = reader.result;

    };

    reader.onerror = reject;

    reader.readAsDataURL(file);

  });

}


/* =========================================
   PRODUCTS
=================================
